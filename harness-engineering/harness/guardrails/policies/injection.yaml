version: 1

# 검색 결과·툴 출력에서 탐지하는 패턴. 탐지되면 해당 청크를 컨텍스트에서 제외하고
# 트레이스에 기록한다. 프롬프트 방어와 이중으로 건다.
patterns:
  - id: ignore_instructions
    match: "(이전|위의).{0,10}(지시|명령|프롬프트).{0,10}(무시|잊)"
  - id: role_override
    match: "(너는|당신은) 이제"
  - id: exfiltration
    match: "(시스템 프롬프트|system prompt).{0,20}(출력|보여|알려)"
  - id: tool_coercion
    match: "(반드시|즉시).{0,20}(전송|발행|결제)"

action: drop_chunk
escalate_after: 3      # 한 실행에서 3회 이상 탐지되면 실행 중단
