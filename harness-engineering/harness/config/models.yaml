version: 1

# 코드는 티어 이름으로만 모델을 참조한다. 교체는 이 파일만 고친다.
tiers:
  fast:
    model: claude-haiku-4-5-20251001
    max_context_tokens: 200000
    use_for: [추출, 분류, 형식 변환]

  balanced:
    model: claude-sonnet-5
    max_context_tokens: 200000
    use_for: [리서치, 카피 생성, 요약]

  deep:
    model: claude-opus-5
    max_context_tokens: 200000
    use_for: [전략 수립, 자기평가, 복잡한 판단]

judge:
  model: claude-opus-5
  note: 평가 대상과 다른 모델을 쓴다. 같은 모델로 채점하면 자기 편향을 통과시킨다.

fallback:
  order: [deep, balanced]
  trigger: [rate_limit, timeout]
  note: 폴백 발생은 트레이스에 기록한다. 조용한 티어 강등은 품질 저하의 원인 추적을 막는다.
