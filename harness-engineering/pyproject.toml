[project]
name = "atlas-harness"
version = "0.1.0"
description = "마케팅 에이전트 하네스 참조 구현 (가상 프로젝트)"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "jsonschema>=4.22",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "ruff>=0.5", "pytest-asyncio>=0.23"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["contract: 툴 스키마 계약 테스트", "slow: 실제 모델 호출"]
